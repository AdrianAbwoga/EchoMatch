<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Audio File</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <h1>Upload an Audio File</h1>

    <form id="uploadForm" action="/upload_audio" method="POST" enctype="multipart/form-data">
        <input type="file" name="audio" accept="audio/*" required>
        <input type="submit" value="Upload">
    </form>

    <h2 id="result"></h2>
    <h3 id="recommendations"></h3>

    <!-- Button to Run Analysis -->
    <button id="runAnalysisButton" style="display: none;">Run Analysis on Uploaded File</button>
    
    <script>
        document.getElementById('uploadForm').onsubmit = async (event) => {
            event.preventDefault();
            
            const formData = new FormData();
            const fileInput = document.querySelector('input[type="file"]');
            formData.append('audio', fileInput.files[0]);

            try {
                const response = await fetch('/upload_audio', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('result').innerText = `Identified Song: ${result.prediction}`;
                    document.getElementById('recommendations').innerText = `Recommendations: ${result.recommendations.join(', ')}`;
                    
                    // Show the button to run analysis
                    document.getElementById('runAnalysisButton').style.display = 'inline-block';
                } else {
                    document.getElementById('result').innerText = 'Error identifying the song.';
                    document.getElementById('recommendations').innerText = '';
                }
            } catch (error) {
                document.getElementById('result').innerText = 'Error uploading file.';
                document.getElementById('recommendations').innerText = '';
            }
        };

        // Handle the run analysis button click
        document.getElementById('runAnalysisButton').onclick = async () => {
            const response = await fetch('/run_analysis', {
                method: 'GET',  // You can change to POST if needed with additional data
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('result').innerText = `Analysis Result: ${result.message}`;
                document.getElementById('recommendations').innerText = `Further Recommendations: ${result.recommendations.join(', ')}`;
            } else {
                alert('Error running analysis');
            }
        };
    </script>
</body>
</html>
